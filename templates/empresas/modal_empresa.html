<!-- Modal de cadastro/edição de empresa -->
<div id="modal-empresa" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <h2 id="modal-titulo" class="text-xl font-bold text-slate-800">Nova Empresa</h2>
            <button onclick="fecharModalEmpresa()" class="text-slate-400 hover:text-slate-600 p-2 rounded-full">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <form id="form-empresa" class="p-6 space-y-4">
            <input type="hidden" id="empresa-id" value="">
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">CNPJ *</label>
                <input type="text" id="empresa-cnpj" required maxlength="14" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg" 
                       placeholder="00000000000000"
                       oninput="this.value = this.value.replace(/\D/g, '')">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Razão Social *</label>
                <input type="text" id="empresa-razao" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg" 
                       placeholder="Nome da empresa">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Ambiente *</label>
                    <select id="empresa-ambiente" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                        <option value="1">Produção</option>
                        <option value="2">Homologação</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">UF *</label>
                    <input type="text" id="empresa-uf" required maxlength="2" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg uppercase" 
                           placeholder="41" value="41">
                </div>
            </div>
            
            <div class="flex justify-end space-x-3 pt-4">
                <button type="button" onclick="fecharModalEmpresa()" 
                        class="px-6 py-2 bg-white border border-slate-200 text-slate-700 font-bold rounded-lg">
                    Cancelar
                </button>
                <button type="submit" 
                        class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg shadow-lg">
                    <i class="fas fa-save mr-2"></i> Salvar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal de upload de certificado -->
<div id="modal-certificado" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center">
            <h2 class="text-xl font-bold text-slate-800">Upload de Certificado</h2>
            <button onclick="fecharModalCertificado()" class="text-slate-400 hover:text-slate-600 p-2 rounded-full">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <form id="form-certificado" class="p-6 space-y-4">
            <input type="hidden" id="certificado-empresa-id" value="">
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Arquivo .pfx ou .p12 *</label>
                <input type="file" id="certificado-arquivo" required accept=".pfx,.p12" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                <p class="text-xs text-gray-500 mt-1">Selecione o arquivo do certificado digital</p>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Senha do Certificado *</label>
                <input type="password" id="certificado-senha" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg" 
                       placeholder="Senha do certificado">
            </div>
            
            <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg">
                <p class="text-sm text-blue-800">
                    <i class="fas fa-info-circle mr-2"></i>
                    O certificado será validado automaticamente. O CNPJ base do certificado deve corresponder ao CNPJ da empresa.
                </p>
            </div>
            
            <div class="flex justify-end space-x-3 pt-4">
                <button type="button" onclick="fecharModalCertificado()" 
                        class="px-6 py-2 bg-white border border-slate-200 text-slate-700 font-bold rounded-lg">
                    Cancelar
                </button>
                <button type="submit" 
                        class="px-6 py-2 bg-purple-600 text-white font-bold rounded-lg shadow-lg">
                    <i class="fas fa-upload mr-2"></i> Enviar
                </button>
            </div>
        </form>
    </div>
</div>
