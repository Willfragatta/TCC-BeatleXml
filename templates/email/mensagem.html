<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ assunto }}</title>
</head>
<body style="margin:0;padding:0;background:#0f172a;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0f172a;padding:24px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;">
                    <tr>
                        <td style="padding:24px 28px 8px;text-align:center;background:#0f172a;">
                            <p style="margin:0;color:#e2e8f0;font-size:18px;font-weight:bold;">BeatleXML</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:28px;">
                            <h1 style="margin:0 0 16px;font-size:20px;color:#0f172a;">{{ titulo }}</h1>
                            <div style="font-size:15px;line-height:1.55;color:#334155;">{{ corpo_html | safe }}</div>
                            {% if botao_url and botao_texto %}
                            <p style="margin:28px 0 8px;text-align:center;">
                                <a href="{{ botao_url }}" style="display:inline-block;background:#0f172a;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:bold;font-size:14px;">{{ botao_texto }}</a>
                            </p>
                            <p style="margin:12px 0 0;font-size:12px;color:#64748b;word-break:break-all;">Se o botão não abrir: {{ botao_url }}</p>
                            {% endif %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 28px 24px;font-size:12px;color:#64748b;border-top:1px solid #e2e8f0;">
                            Este e-mail foi enviado por {{ from_name }}. Dúvidas: {{ contato }}.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
