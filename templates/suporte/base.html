<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Beatle_XML - Suporte{% endblock %}</title>
    {% set meta_robots = 'noindex, nofollow' %}
    {% set og_title = 'BeatleXML Suporte' %}
    {% include "partials/meta.html" %}
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-100 font-sans text-gray-900">
    {% include "suporte/header.html" %}
    <main class="pt-20 p-6">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/beatle_fetch.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
