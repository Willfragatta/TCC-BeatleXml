<header class="bg-blue-900 text-white shadow-lg fixed top-0 left-0 right-0 z-50">
    <div class="flex justify-between items-center px-6 py-4">
        <div class="flex items-center space-x-4">
            <a href="/" class="flex items-center">
                <img src="/static/img/beatlexmlLogo.png" alt="BeatleXML Logo" class="h-8 w-auto" style="filter: brightness(0) invert(1);">
            </a>
            <span class="bg-blue-600 px-3 py-1 rounded text-xs uppercase tracking-wider font-bold">Demonstração</span>
        </div>
        <div class="flex items-center space-x-4">
            <div class="relative">
                <button id="menu-usuario-btn" type="button" class="flex items-center space-x-2 hover:bg-blue-800 px-3 py-2 rounded">
                    <i class="fas fa-user-circle text-xl"></i>
                    <span>{% if usuario.nome_completo %}{{ usuario.nome_completo }}{% else %}{{ usuario.email }}{% endif %}</span>
                    <i class="fas fa-chevron-down text-xs"></i>
                </button>
                <div id="menu-usuario-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded shadow-lg py-2 z-50">
                    <a href="/usuarios" class="block px-4 py-2 text-gray-800 hover:bg-gray-100">
                        <i class="fas fa-user mr-2"></i> Perfil
                    </a>
                    <a href="/config/empresas" class="block px-4 py-2 text-gray-800 hover:bg-gray-100">
                        <i class="fas fa-building mr-2"></i> Empresas
                    </a>
                    <a href="/auth/logout" class="block px-4 py-2 text-gray-800 hover:bg-gray-100 border-t">
                        <i class="fas fa-sign-out-alt mr-2"></i> Sair
                    </a>
                </div>
            </div>
        </div>
    </div>
</header>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('menu-usuario-btn');
    const dropdown = document.getElementById('menu-usuario-dropdown');
    if (!btn || !dropdown) return;

    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdown.classList.toggle('hidden');
    });

    document.addEventListener('click', function() {
        dropdown.classList.add('hidden');
    });
});
</script>
