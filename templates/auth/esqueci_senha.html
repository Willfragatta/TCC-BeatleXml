{% extends "layout/base.html" %}

{% block title %}Esqueci minha senha - Beatle_XML{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-blue-700">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Recuperar Senha</h1>
            <p class="text-gray-600">Digite seu email para receber o link de recuperação</p>
        </div>
        
        <form id="resetForm" method="POST" action="/auth/esqueci-senha" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Email</label>
                <input type="email" name="email" required 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg">
                <i class="fas fa-envelope mr-2"></i> Enviar Link de Recuperação
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <a href="/auth/login" class="text-blue-600 hover:text-blue-800 font-bold">Voltar ao login</a>
        </div>
        
        <div id="mensagem" class="mt-4 hidden"></div>
    </div>
</div>

<script>
document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    try {
        if (window.beatleRecaptchaToken) {
            const token = await window.beatleRecaptchaToken('reset');
            if (token) {
                formData.set('g-recaptcha-response', token);
                formData.set('recaptcha_token', token);
            }
        }
        const res = await fetch('/auth/esqueci-senha', {
            method: 'POST',
            body: formData
        });
        
        const data = await res.json();
        const mensagem = document.getElementById('mensagem');
        mensagem.classList.remove('hidden');
        
        if (res.ok) {
            mensagem.className = 'mt-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded';
            mensagem.textContent = '';
            const strong = document.createElement('strong');
            strong.textContent = 'Pronto. ';
            mensagem.appendChild(strong);
            mensagem.appendChild(document.createTextNode(data.message || ''));
            if (data.reset_url) {
                mensagem.appendChild(document.createElement('br'));
                mensagem.appendChild(document.createElement('br'));
                const a = document.createElement('a');
                a.href = String(data.reset_url);
                a.className = 'text-blue-600 underline';
                a.textContent = 'Clique aqui para resetar sua senha';
                mensagem.appendChild(a);
            }
        } else {
            mensagem.className = 'mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded';
            mensagem.textContent = data.detail || 'Erro ao processar solicitação';
        }
    } catch (error) {
        const mensagem = document.getElementById('mensagem');
        mensagem.classList.remove('hidden');
        mensagem.className = 'mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded';
        mensagem.textContent = 'Erro ao processar solicitação';
    }
});
</script>
{% endblock %}
