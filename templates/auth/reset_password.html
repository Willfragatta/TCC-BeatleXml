{% extends "layout/base.html" %}

{% block title %}Resetar Senha - Beatle_XML{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-blue-700">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Nova Senha</h1>
            <p class="text-gray-600">Digite sua nova senha</p>
        </div>
        
        <form id="resetPasswordForm" method="POST" action="/auth/reset-password" class="space-y-6">
            <input type="hidden" name="token" value="{{ token or '' }}">
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Nova Senha</label>
                <input type="password" name="nova_senha" required minlength="6"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <p class="text-xs text-gray-500 mt-1">Mínimo de 6 caracteres</p>
            </div>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Confirmar Senha</label>
                <input type="password" name="confirmar_senha" required minlength="6"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg">
                <i class="fas fa-key mr-2"></i> Alterar Senha
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <a href="/auth/login" class="text-blue-600 hover:text-blue-800 font-bold">Voltar ao login</a>
        </div>
        
        <div id="mensagem" class="mt-4 hidden"></div>
    </div>
</div>

<script>
document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const novaSenha = formData.get('nova_senha');
    const confirmarSenha = formData.get('confirmar_senha');
    
    if (novaSenha !== confirmarSenha) {
        const mensagem = document.getElementById('mensagem');
        mensagem.classList.remove('hidden');
        mensagem.className = 'mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded';
        mensagem.textContent = 'As senhas não coincidem';
        return;
    }
    
    try {
        if (window.beatleRecaptchaToken) {
            const token = await window.beatleRecaptchaToken('reset');
            if (token) {
                formData.set('g-recaptcha-response', token);
                formData.set('recaptcha_token', token);
            }
        }
        const res = await fetch('/auth/reset-password', {
            method: 'POST',
            body: formData
        });
        
        const data = await res.json();
        const mensagem = document.getElementById('mensagem');
        mensagem.classList.remove('hidden');
        
        if (res.ok) {
            mensagem.className = 'mt-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded';
            mensagem.innerHTML = `<strong>Sucesso!</strong> ${data.message}<br><br><a href="/auth/login" class="text-blue-600 underline">Fazer login</a>`;
            document.getElementById('resetPasswordForm').reset();
        } else {
            mensagem.className = 'mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded';
            mensagem.textContent = data.detail || 'Erro ao processar solicitação';
        }
    } catch (error) {
        const mensagem = document.getElementById('mensagem');
        mensagem.classList.remove('hidden');
        mensagem.className = 'mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded';
        mensagem.textContent = 'Erro ao processar solicitação';
    }
});
</script>
{% endblock %}
